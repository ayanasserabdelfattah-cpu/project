<section class="register">


<div class="container">
    <div class="row">
        <div class="col-md-12">

<div class="d-flex justify-content-center align-items-center mt-5">

    <form class="form ">
        <p class="title">Register </p>
        <p class="message">Signup now and get full access to our app. </p>
            <div class="flex">
            <label>
                <input class="input" type="text" name="firstname" placeholder="" required="">
                <span>Firstname</span>
            </label>
    
            <label>
                <input class="input" type="text"  name="lastname" placeholder="" required="">
                <span>Lastname</span>
            </label>
        </div>  
                
        <label>
            <input class="input" type="email" name="email" placeholder="" required="">
            <span>Email</span>
        </label> 
            
        <label>
            <input class="input" type="password" name="pass" placeholder="" required="">
            <span>Password</span>
        </label>
        <label>
            <input class="input" type="password" name="confirm password" placeholder="" required="">
            <span>Confirm password</span>
        </label>
        <button class="submit">Submit</button>
        <p class="signin">Already have an acount ? <a href="login.html">Signin</a> </p>
    </form>

</div>


        </div>
    </div>
</div>
